<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      .slider-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        height: 400px;
        margin: auto;
        overflow: hidden;
        border-radius: 10px;
      }

      .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 0.8s ease-in-out;
      }

      .slide.active {
        opacity: 1;
      }

      /* Botões */
      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        padding: 15px;
        cursor: pointer;
        font-size: 18px;
        z-index: 10;
      }

      .arrow:hover {
        background-color: rgba(0, 0, 0, 0.8);
      }
      .left {
        left: 10px;
      }
      .right {
        right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="slider-container">
      <div
        class="slide active"
        style="
          background-image: url(&quot;https://picsum.photos/id/10/800/400&quot;);
        "
      ></div>
      <div
        class="slide"
        style="
          background-image: url(&quot;https://picsum.photos/id/20/800/400&quot;);
        "
      ></div>
      <div
        class="slide"
        style="
          background-image: url(&quot;https://picsum.photos/id/30/800/400&quot;);
        "
      ></div>

      <button class="arrow left" id="prevBtn">&#10094;</button>
      <button class="arrow right" id="nextBtn">&#10095;</button>
    </div>
    <script>
      const slides = document.querySelectorAll(".slide");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      let currentIndex = 0;

      function showSlide(index) {
        // Remove a classe ativa do slide atual
        slides[currentIndex].classList.remove("active");

        // Calcula o novo índice (com loop infinito)
        currentIndex = (index + slides.length) % slides.length;

        // Adiciona a classe ativa no novo slide
        slides[currentIndex].classList.add("active");
      }

      nextBtn.addEventListener("click", () => showSlide(currentIndex + 1));
      prevBtn.addEventListener("click", () => showSlide(currentIndex - 1));

      // Opcional: Auto-play a cada 5 segundos
      setInterval(() => showSlide(currentIndex + 1), 5000);
    </script>
  </body>
</html>
