<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <style>
      .cards {
        display: flex;
        overflow-x: auto; /* Fundamental para o scroll existir */
        scroll-behavior: smooth; /* Faz o movimento ser suave */
        gap: 20px;
      }

      .card {
        flex: 0 0 250px; /* Impede o card de encolher */
        height: 300px;
        background: #ddd;
      }
    </style>
  </head>
  <body>

    <div class="container-cards">
      <div class="cards" id="cards-container">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
      </div>
      <button class="arrow-btn" id="btn-right">&#10095;88888</button>
      <button class="arrow-btn" id="btn-left">&#10094;00000</button>
    </div>

    <script>
      // Espera a página carregar completamente
      window.onload = function () {
        const container = document.getElementById("cards-container");
        const btnLeft = document.getElementById("btn-left");
        const btnRight = document.getElementById("btn-right");

        // Teste de diagnóstico: se aparecer no console, o JS achou os elementos
        console.log("Container:", container, "Botoes:", btnLeft, btnRight);

        if (btnLeft && btnRight && container) {
          btnLeft.onclick = function () {
            console.log("Clicou na esquerda");
            container.scrollBy({ left: -300, behavior: "smooth" });
          };

          btnRight.onclick = function () {
            console.log("Clicou na direita");
            container.scrollBy({ left: 300, behavior: "smooth" });
          };
        } else {
          console.error(
            "Erro: Elementos não encontrados. Verifique os IDs no HTML.",
          );
        }
      };
    </script>
  </body>
</html>
